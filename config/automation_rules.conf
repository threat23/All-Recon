# VON.THREAT AUTOMATION RULES CONFIGURATION
# Define how your scans behave automatically - less thinking, more doing

# ─── AUTOMATION BEHAVIOR ───────────────────────────────────
# Enable background parallel scanning
ENABLE_PARALLEL_SCANNING="true"

# Auto-save all results
AUTO_SAVE_RESULTS="true"

# Auto-generate reports after each scan
AUTO_GENERATE_REPORTS="true"

# ─── OUTPUT FORMATTING ─────────────────────────────────────
# Timestamp all outputs
TIMESTAMP_OUTPUTS="true"

# Organize by date/time
ORGANIZE_BY_DATE="true"

# Keep session logs
KEEP_SESSION_LOGS="true"

# ─── NOTIFICATION RULES ────────────────────────────────────
# Alert on high-risk ports
ALERT_ON_COMMON_VULNS="true"

# Alert on unexpected services
ALERT_ON_ANOMALIES="true"

# Log all findings
VERBOSE_LOGGING="true"

# ─── PERFORMANCE TUNING ────────────────────────────────────
# Maximum parallel scans per session
MAX_PARALLEL_SCANS=4

# Connection timeout (seconds)
TIMEOUT_CONNECT=30

# Port scan timeout per host (seconds)
TIMEOUT_PORT_SCAN=300

# Default scan speed template (quick|standard|thorough|stealth)
DEFAULT_SCAN_PROFILE="standard"

# ─── REPORTING ─────────────────────────────────────────────
# Report format (txt|xml|json|html)
REPORT_FORMAT="txt"

# Include detailed findings
REPORT_INCLUDE_DETAILS="true"

# Include historical comparisons
REPORT_INCLUDE_HISTORY="true"

# Auto-archive old reports (days)
AUTO_ARCHIVE_AFTER=30

# ─── SECURITY ──────────────────────────────────────────────
# Log all commands executed
LOG_COMMANDS="true"

# Capture timestamps with nanosecond precision
PRECISE_TIMESTAMPS="true"

# Hash results for integrity verification
HASH_RESULTS="true"
