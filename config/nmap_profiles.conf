# VON.THREAT NMAP SCAN PROFILES
# Use these pre-tuned profiles to streamline your reconnaissance
# Philosophy: Define once, execute many. No wasted thinking.

# ─── QUICK RECONNAISSANCE ──────────────────────────────────
# Speed: ⚡⚡⚡ (2-3 min per host)
# Coverage: 🎯 (Top 100 ports)
# Use for: Initial discovery, quick sweeps, noisy environments
PROFILE_QUICK="-T4 -p 1-1000 -sS"

# ─── STANDARD ANALYSIS ─────────────────────────────────────
# Speed: ⚡⚡ (10-15 min per host)
# Coverage: 🎯🎯 (All TCP ports + OS detection)
# Use for: Default penetration testing workflow
PROFILE_STANDARD="-sS -O --osscan-guess --osscan-limit -T4 -p- -A"

# ─── THOROUGH RECONNAISSANCE ───────────────────────────────
# Speed: ⚡ (30-60 min per host)
# Coverage: 🎯🎯🎯 (All ports + OS + services + scripts)
# Use for: Critical targets, final validation scans
PROFILE_THOROUGH="-sS -sU -O --osscan-guess -T3 -A -p- --script default,discovery"

# ─── STEALTH MODE ──────────────────────────────────────────
# Speed: 🐢 (1-3 hours per host)
# Coverage: 🎯 (Limited but evasive)
# Use for: Evasion scenarios, paranoid environments
PROFILE_STEALTH="-T1 -Pn -p- -sS --spoof-mac 0"

# ─── UDP SWEEP ─────────────────────────────────────────────
# Speed: ⚡⚡ (5-10 min per host)
# Coverage: 🎯🎯 (Common UDP services)
# Use for: DNS, SNMP, NTP, DHCP discovery
PROFILE_UDP="-sU --top-ports 100 -T4"

# ─── VULNERABILITY SCAN ────────────────────────────────────
# Speed: ⚡ (15-30 min per host)
# Coverage: 🎯🎯🎯 (Version detection + NSE scripts)
# Use for: Post-discovery vulnerability assessment
PROFILE_VULN="-sS -sV --script vuln -T4 -p- -A"

# ─── FIREWALL EVASION ──────────────────────────────────────
# Speed: 🐢 (Custom)
# Coverage: 🎯 (Depends on configuration)
# Use for: Firewall-protected targets
PROFILE_EVASION="-f -Pn -D RND:10 -sS -p-"

# Export formats for automated capture
AUTO_EXPORT_FORMATS="nmap,xml,txt"

# Parallel scanning limits (adjust based on network)
MAX_PARALLEL_SCANS=4

# Alert thresholds
ALERT_ON_PORTS="22,445,3389,5985,5986,8080,9200"
ALERT_ON_SERVICES="ssh,smb,rdp,winrm,http,elasticsearch"
