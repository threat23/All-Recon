# VON.THREAT SUBDOMAIN CLEANER CONFIGURATION
# Configure subdomain cleaning & deduplication behavior

# --- CLEANING RULES ---------------------------------------
# Remove unresolved subdomains (no IP found)
REMOVE_UNRESOLVED="true"

# Remove duplicate subdomains
REMOVE_DUPLICATES="true"

# Remove common false positives
FILTER_FALSE_POSITIVES="true"

# --- FILTERING OPTIONS ------------------------------------
# Only keep active hosts (resolved IPs)
KEEP_ACTIVE_ONLY="false"

# Minimum response time (ms)
MIN_RESPONSE_TIME=0

# Maximum response time (ms)
MAX_RESPONSE_TIME=10000

# --- IP FILTERING ----------------------------------------
# Exclude private IP ranges (RFC 1918)
EXCLUDE_PRIVATE_IPS="false"

# Exclude localhost/loopback
EXCLUDE_LOCALHOST="true"

# Exclude IPv6 (keep IPv4 only)
EXCLUDE_IPV6="false"

# --- GROUPING -------------------------------------------
# Group by IP address
GROUP_BY_IP="true"

# Show co-hosted domains
SHOW_COHOSTED="true"

# --- OUTPUT FORMATS ------------------------------------
# Generate CSV export
EXPORT_CSV="true"

# Generate JSON export
EXPORT_JSON="true"

# Generate TXT summary
EXPORT_TXT="true"

# --- DEDUPLICATION ---------------------------------------
# Case-insensitive deduplication
CASE_INSENSITIVE_DEDUP="true"

# Remove trailing dots from FQDNs
REMOVE_TRAILING_DOTS="true"

# --- PERFORMANCE ---------------------------------------
# Parallel DNS resolution threads
PARALLEL_RESOLUTION_THREADS=10

# DNS resolution timeout (seconds)
DNS_RESOLUTION_TIMEOUT=5

# --- LOGGING -------------------------------------------
# Verbose logging
VERBOSE_LOGGING="true"

# Log all operations
LOG_ALL_OPERATIONS="true"

# --- ALERTS -------------------------------------------
# Alert on interesting subdomains
ALERT_ON_KEYWORDS="true"

# Keywords to watch for
ALERT_KEYWORDS="admin,backup,dev,staging,test,internal,secret,api,vpn,db"

# Alert on unusual patterns
ALERT_ON_PATTERNS="true"
