# VON.THREAT SUBDOMAIN DISCOVERY CONFIGURATION
# Configure subdomain enumeration behavior

# ─── SUBDOMAIN DISCOVERY METHODS ───────────────────────────
# Enable/disable specific discovery methods
ENABLE_DNS_ENUMERATION="true"
ENABLE_COMMON_BRUTEFORCE="true"
ENABLE_REVERSE_LOOKUP="true"
ENABLE_PUBLIC_DNS="true"
ENABLE_CERT_TRANSPARENCY="true"
ENABLE_PASSIVE_OSINT="true"

# ─── PASSIVE OSINT API SETTINGS ────────────────────────────
ENABLE_HACKERTARGET="true"
ENABLE_ALIENVULT_OTX="true"
ENABLE_RAPIDDNS="true"
SECURITYTRAILS_API_KEY=""
SHODAN_API_KEY=""

# ─── BRUTE FORCE SETTINGS ──────────────────────────────────
# Wordlist size for subdomain brute force
WORDLIST_SIZE="medium"  # small, medium, large
BRUTEFORCE_TIMEOUT=5    # seconds per subdomain

# ─── TIMEOUT SETTINGS ──────────────────────────────────────
DNS_LOOKUP_TIMEOUT=10
ZONE_TRANSFER_TIMEOUT=15
CERT_TRANSPARENCY_TIMEOUT=30

# ─── OUTPUT FORMATTING ─────────────────────────────────────
# Export formats
SUBDOMAIN_EXPORT_FORMAT="txt,json"

# Include high-risk findings
ALERT_ON_SENSITIVE_SUBDOMAINS="true"
SENSITIVE_KEYWORDS="admin,admin,backup,backup,dev,development,db,database,staging,stage,test,internal,private,secret,api,vpn"

# ─── LOGGING ───────────────────────────────────────────────
# Verbose logging
VERBOSE_SUBDOMAIN_LOGGING="true"

# Log all DNS queries
LOG_DNS_QUERIES="false"

# ─── CERTIFICATE TRANSPARENCY ─────────────────────────────
# Use crt.sh API (free)
USE_CRT_SH="true"

# Alert on wildcard certs
ALERT_ON_WILDCARDS="true"

# ─── PERFORMANCE ───────────────────────────────────────────
# Parallel DNS queries
PARALLEL_DNS_QUERIES=10

# Max concurrent operations
MAX_CONCURRENT_OPERATIONS=5

# ─── FILTERING ──────────────────────────────────────────────
# Filter out common false positives
FILTER_CDN_SUBDOMAINS="false"
FILTER_INVALID_DOMAINS="true"

# ─── NOTIFICATION ──────────────────────────────────────────
# Alert on interesting subdomains
ALERT_ON_OPEN_PORTS="true"
ALERT_ON_LIVE_HOSTS="true"
ALERT_THRESHOLD="medium"  # low, medium, high

# ─── EXTENDED WORDLISTS ─────────────────────────────────────
# Use extended subdomain lists
USE_EXTENDED_WORDLIST="false"

# Custom wordlist path
CUSTOM_WORDLIST_PATH="config/subdomains.wordlist"
