<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950">
  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .box { fill: #f8fafc; stroke: #3b82f6; stroke-width: 2.5; rx: 18; }
      .sub { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .note { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1500" height="950" fill="#ffffff"/>
  <text x="750" y="55" text-anchor="middle" class="title">Reconnaissance Workflow</text>

  <rect x="100" y="120" width="210" height="110" class="box"/>
  <text x="205" y="165" text-anchor="middle" class="label">Researcher</text>
  <text x="205" y="195" text-anchor="middle" class="small">Select target / profile</text>

  <rect x="400" y="120" width="240" height="110" class="box"/>
  <text x="520" y="165" text-anchor="middle" class="label">Input Validation</text>
  <text x="520" y="195" text-anchor="middle" class="small">Check IPs, domains, targets</text>

  <rect x="760" y="120" width="260" height="110" class="box"/>
  <text x="890" y="165" text-anchor="middle" class="label">Module Dispatcher</text>
  <text x="890" y="195" text-anchor="middle" class="small">Run DNS / scan / web / OSINT</text>

  <rect x="1170" y="120" width="220" height="110" class="box"/>
  <text x="1280" y="165" text-anchor="middle" class="label">Results</text>
  <text x="1280" y="195" text-anchor="middle" class="small">JSON / CSV / HTML</text>

  <rect x="230" y="360" width="260" height="130" class="sub"/>
  <text x="360" y="410" text-anchor="middle" class="label">1. Define Target</text>
  <text x="360" y="440" text-anchor="middle" class="small">IP, domain, host list, or URL</text>

  <rect x="560" y="360" width="260" height="130" class="sub"/>
  <text x="690" y="410" text-anchor="middle" class="label">2. Execute Modules</text>
  <text x="690" y="440" text-anchor="middle" class="small">DNS, host, HTTP, passive routes</text>

  <rect x="890" y="360" width="260" height="130" class="sub"/>
  <text x="1020" y="410" text-anchor="middle" class="label">3. Parse + Clean</text>
  <text x="1020" y="440" text-anchor="middle" class="small">Deduplicate, normalize, group</text>

  <rect x="520" y="610" width="430" height="150" class="note"/>
  <text x="735" y="670" text-anchor="middle" class="label">4. Generate Report</text>
  <text x="735" y="700" text-anchor="middle" class="small">Summary of risks, services, host exposure, DNS, HTTP data</text>
  <text x="735" y="730" text-anchor="middle" class="small">Decision support for the researcher</text>

  <path d="M310 230 L400 230" class="arrow"/>
  <path d="M640 230 L760 230" class="arrow"/>
  <path d="M1020 230 L1170 230" class="arrow"/>

  <path d="M360 490 L360 560 L560 560" class="arrow"/>
  <path d="M690 490 L690 610" class="arrow"/>
  <path d="M1020 490 L1020 560 L950 560" class="arrow"/>

  <path d="M1040 610 L1040 770 L950 770" class="arrow"/>
  <path d="M560 770 L520 770 L520 620 L560 620" class="arrow"/>

  <rect x="1090" y="660" width="260" height="110" class="box"/>
  <text x="1220" y="705" text-anchor="middle" class="label">Ethical Safeguards</text>
  <text x="1220" y="735" text-anchor="middle" class="small">Permission, rate limits, audit logs</text>

  <path d="M950 700 L1090 700" class="arrow"/>
</svg>
